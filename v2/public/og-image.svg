<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: dark charcoal matching the brand -->
  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252525" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- J Logo (centered, large) -->
  <g transform="translate(500, 120)">
    <rect width="200" height="200" rx="40" fill="#242424" stroke="#333" stroke-width="2"/>
    <path d="M70 40H125V50C125 50 125 115 125 135C125 155 110 170 90 170C70 170 55 155 55 135V110" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="40" r="12" fill="#ff0000"/>
  </g>

  <!-- Brand text -->
  <text x="600" y="390" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">javabypankaj</text>

  <!-- Tagline -->
  <text x="600" y="440" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#9a9a9a">Crack Any Java Interview</text>

  <!-- Stats line -->
  <text x="600" y="490" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#5bc858">2466+ Questions  |  26 Chapters  |  Free &amp; Open</text>

  <!-- Bottom accent line -->
  <rect x="400" y="540" width="400" height="3" rx="1.5" fill="#ff0000" opacity="0.8"/>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" fill="#6b6b6b">javabypankaj.live</text>
</svg>
