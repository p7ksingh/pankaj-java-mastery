name: Deploy v2 to AWS S3

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_QUESTIONS_API: ${{ secrets.NEXT_PUBLIC_QUESTIONS_API }}
          NEXT_PUBLIC_TYPESENSE_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_TYPESENSE_SEARCH_KEY }}
          NEXT_PUBLIC_TYPESENSE_HOST: ${{ secrets.NEXT_PUBLIC_TYPESENSE_HOST }}
          NEXT_PUBLIC_LIKES_API: ${{ secrets.NEXT_PUBLIC_LIKES_API }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_DATA_SOURCE: local

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to S3
        run: |
          aws s3 sync out/ s3://javabypankaj \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt"

          # HTML files: short cache (revalidate on deploy)
          aws s3 sync out/ s3://javabypankaj \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --exclude "*" \
            --content-type "text/html"

          # XML/TXT: short cache
          aws s3 cp out/sitemap.xml s3://javabypankaj/sitemap.xml \
            --cache-control "public, max-age=3600" \
            --content-type "application/xml"

          aws s3 cp out/robots.txt s3://javabypankaj/robots.txt \
            --cache-control "public, max-age=3600" \
            --content-type "text/plain"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1Q6QZJNQB5S54 \
            --paths "/*"

      - name: Done
        run: echo "v2 deployed to https://www.javabypankaj.live"
